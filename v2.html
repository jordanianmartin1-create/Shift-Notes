<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thorndon Ward ICA Log</title>
  <style>
    :root {
      --ward-blue: #0b4d7a;
      --nhs-blue: #005eb8;
      --nhs-grey: #425563;
      --nhs-light-grey: #f0f4f5;
      --nhs-white: #ffffff;
      --nhs-border: #d8dde0;
      --nhs-text: #212b32;
      --nhs-red-bg: #fce8e6;
      --nhs-red-text: #c5221f;
      --nhs-red-border: #f5c2be;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--nhs-white);
      color: var(--nhs-text);
      line-height: 1.4;
      padding-bottom: 85px;
    }

    header {
      background-color: var(--ward-blue);
      color: var(--nhs-white);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.2;
    }

    header p {
      font-size: 0.72rem;
      opacity: 0.85;
      margin-top: 2px;
    }

    .status-badge {
      font-size: 0.75rem;
      background-color: rgba(255, 255, 255, 0.2);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 500;
    }

    nav {
      background: var(--nhs-white);
      border-bottom: 1px solid var(--nhs-border);
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      position: sticky;
      top: 54px;
      z-index: 99;
      -webkit-overflow-scrolling: touch;
    }

    nav button {
      background: none;
      border: none;
      padding: 12px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--nhs-grey);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      flex-shrink: 0;
    }

    nav button.active {
      color: var(--ward-blue);
      border-bottom-color: var(--ward-blue);
    }

    .container {
      padding: 16px;
      max-width: 760px;
      margin: 0 auto;
    }

    .intro-text {
      font-size: 0.85rem;
      color: var(--nhs-grey);
      margin-bottom: 4px;
    }

    .allocated-summary {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--nhs-text);
      margin-bottom: 14px;
    }

    .bed-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .bed-btn {
      background: var(--nhs-white);
      border: 1px solid var(--nhs-border);
      border-radius: 8px;
      padding: 13px 8px;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--nhs-text);
      cursor: pointer;
      text-align: center;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .bed-btn.selected {
      background: var(--nhs-blue);
      color: var(--nhs-white);
      border-color: var(--nhs-blue);
      font-weight: 700;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--nhs-white);
      border-top: 1px solid var(--nhs-border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      max-width: 760px;
      margin: 0 auto;
    }

    .btn-clear {
      background: var(--nhs-red-bg);
      color: var(--nhs-red-text);
      border: 1px solid var(--nhs-red-border);
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-handover {
      background: var(--ward-blue);
      color: var(--nhs-white);
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .card {
      background: var(--nhs-white);
      border: 1px solid var(--nhs-border);
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .card h2 {
      font-size: 1.05rem;
      margin-bottom: 12px;
      color: var(--ward-blue);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tracking-toggles {
      background: var(--nhs-light-grey);
      border: 1px solid var(--nhs-border);
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 16px;
    }

    .tracking-toggles small {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--nhs-grey);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .toggle-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .toggle-chip {
      background: var(--nhs-white);
      border: 1px solid var(--nhs-border);
      color: var(--nhs-grey);
      border-radius: 16px;
      padding: 6px 11px;
      font-size: 0.78rem;
      cursor: pointer;
    }

    .toggle-chip.active {
      background: var(--ward-blue);
      color: var(--nhs-white);
      border-color: var(--ward-blue);
      font-weight: 600;
    }

    .field-row {
      margin-bottom: 14px;
      background: #fff;
      border: 1px solid var(--nhs-border);
      padding: 12px;
      border-radius: 6px;
    }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--nhs-grey);
      text-transform: uppercase;
    }

    input, select, textarea {
      width: 100%;
      padding: 9px;
      border: 1px solid var(--nhs-border);
      border-radius: 4px;
      font-size: 0.92rem;
      background: var(--nhs-white);
    }

    .area-grid {
      display: grid;
      grid-template-columns: 130px 1fr 1.2fr;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    @media (max-width: 600px) {
      .area-grid {
        grid-template-columns: 1fr;
        gap: 5px;
        margin-bottom: 12px;
        background: var(--nhs-light-grey);
        padding: 8px;
        border-radius: 4px;
      }
    }

    .btn-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .chip-btn {
      background: var(--nhs-light-grey);
      border: 1px solid var(--nhs-border);
      border-radius: 16px;
      padding: 6px 11px;
      font-size: 0.78rem;
      cursor: pointer;
    }

    .chip-btn:active {
      background: var(--ward-blue);
      color: var(--nhs-white);
    }

    .secondary-btn {
      background-color: var(--nhs-white);
      color: var(--ward-blue);
      border: 1px solid var(--ward-blue);
      padding: 7px 12px;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
    }

    .copy-block {
      background: #fafafa;
      border-left: 3px solid var(--ward-blue);
      padding: 12px;
      font-family: monospace;
      font-size: 0.84rem;
      white-space: pre-wrap;
      margin-bottom: 12px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Thorndon Ward ICA Log</h1>
      <p>Offline Shift Notepad • SystmOne Staging</p>
    </div>
    <span class="status-badge" id="save-status">Auto-Saved</span>
  </header>

  <nav id="navbar">
    <button class="active" id="btn-tab-allocation" onclick="showTab('allocation')">Beds</button>
    <button id="btn-tab-summary" onclick="showTab('summary')">Summary</button>
  </nav>

  <div class="container">
    
    <!-- Bed Allocation Tab -->
    <div id="tab-allocation" class="tab-content active">
      <p class="intro-text">Tap beds below to allocate to your shift.</p>
      <div class="allocated-summary" id="allocated-summary-text">Allocated (0): None selected</div>

      <div class="bed-grid" id="bed-buttons-container">
        <button type="button" class="bed-btn" onclick="toggleBed('Bay 1 Bed 1', this)">Bay 1 Bed 1</button>
        <button type="button" class="bed-btn" onclick="toggleBed('Bay 1 Bed 2', this)">Bay 1 Bed 2</button>
        <button type="button" class="bed-btn" onclick="toggleBed('Bay 2 Bed 1', this)">Bay 2 Bed 1</button>
        <button type="button" class="bed-btn" onclick="toggleBed('Bay 2 Bed 2', this)">Bay 2 Bed 2</button>
        <button type="button" class="bed-btn" onclick="toggleBed('Bay 2 Bed 3', this)">Bay 2 Bed 3</button>
        <button type="button" class="bed-btn" onclick="toggleBed('Bay 2 Bed 4', this)">Bay 2 Bed 4</button>
        <button type="button" class="bed-btn" onclick="toggleBed('Bay 3 Bed 1', this)">Bay 3 Bed 1</button>
        <button type="button" class="bed-btn" onclick="toggleBed('Bay 3 Bed 2', this)">Bay 3 Bed 2</button>
        <button type="button" class="bed-btn" onclick="toggleBed('Bay 3 Bed 3', this)">Bay 3 Bed 3</button>
        <button type="button" class="bed-btn" onclick="toggleBed('Bay 3 Bed 4', this)">Bay 3 Bed 4</button>
        <button type="button" class="bed-btn" onclick="toggleBed('Bay 4 Bed 1', this)">Bay 4 Bed 1</button>
        <button type="button" class="bed-btn" onclick="toggleBed('Bay 4 Bed 2', this)">Bay 4 Bed 2</button>
        <button type="button" class="bed-btn" onclick="toggleBed('Bay 4 Bed 3', this)">Bay 4 Bed 3</button>
        <button type="button" class="bed-btn" onclick="toggleBed('Bay 4 Bed 4', this)">Bay 4 Bed 4</button>
        <button type="button" class="bed-btn" onclick="toggleBed('Bay 5 Bed 1', this)">Bay 5 Bed 1</button>
        <button type="button" class="bed-btn" onclick="toggleBed('Bay 5 Bed 2', this)">Bay 5 Bed 2</button>
        <button type="button" class="bed-btn" onclick="toggleBed('Bay 5 Bed 3', this)">Bay 5 Bed 3</button>
        <button type="button" class="bed-btn" onclick="toggleBed('Bay 5 Bed 4', this)">Bay 5 Bed 4</button>
        <button type="button" class="bed-btn" onclick="toggleBed('Side Room 1', this)">Side Room 1</button>
        <button type="button" class="bed-btn" onclick="toggleBed('Side Room 2', this)">Side Room 2</button>
        <button type="button" class="bed-btn" onclick="toggleBed('Side Room 3', this)">Side Room 3</button>
        <button type="button" class="bed-btn" onclick="toggleBed('Side Room 4', this)">Side Room 4</button>
        <button type="button" class="bed-btn" onclick="toggleBed('Side Room 5', this)">Side Room 5</button>
        <button type="button" class="bed-btn" onclick="toggleBed('Side Room 6', this)">Side Room 6</button>
        <button type="button" class="bed-btn" onclick="toggleBed('Side Room 7', this)">Side Room 7</button>
      </div>
    </div>

    <!-- Dynamic Bed Entry Cards -->
    <div id="dynamic-bed-containers"></div>

    <!-- Handover Summary Tab -->
    <div id="tab-summary" class="tab-content">
      <div class="card">
        <h2>SystmOne Handover Summary</h2>
        <p style="font-size: 0.82rem; color: var(--nhs-grey); margin-bottom: 14px;">
          Review and copy figures straight into SystmOne when you log onto the laptop.
        </p>
        <div id="summary-cards"></div>
      </div>
    </div>

  </div>

  <!-- Bottom Actions -->
  <div class="bottom-bar">
    <button type="button" class="btn-clear" onclick="clearShift()">Clear Shift</button>
    <button type="button" class="btn-handover" onclick="showTab('summary')">Copy Handover</button>
  </div>

  <script>
    const DEFAULT_CONFIG = {
      news: true,
      bowels: true,
      amys: false,
      turning: false,
      lsbp: false,
      weight: false,
      fluids: false,
      diet: false,
      bm: false,
      events: true
    };

    let state = {
      allocated: [],
      configs: {},
      data: {}
    };

    function init() {
      try {
        const saved = localStorage.getItem("thorndon_shift_v2_data");
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && typeof parsed === "object") {
            state.allocated = Array.isArray(parsed.allocated) ? parsed.allocated : [];
            state.configs = parsed.configs || {};
            state.data = parsed.data || {};
          }
        }
      } catch (e) {
        state = { allocated: [], configs: {}, data: {} };
      }

      refreshGridButtons();
      renderNavigation();
      renderBedTabs();
      updateAllocationSummary();
    }

    function saveState() {
      localStorage.setItem("thorndon_shift_v2_data", JSON.stringify(state));
      const status = document.getElementById("save-status");
      if (status) {
        status.textContent = "Saved";
        setTimeout(() => { status.textContent = "Auto-Saved"; }, 1000);
      }
    }

    function toggleBed(bed, btnEl) {
      if (!Array.isArray(state.allocated)) state.allocated = [];
      
      const idx = state.allocated.indexOf(bed);
      if (idx > -1) {
        state.allocated.splice(idx, 1);
        if (btnEl) btnEl.classList.remove("selected");
      } else {
        state.allocated.push(bed);
        if (btnEl) btnEl.classList.add("selected");
      }

      saveState();
      updateAllocationSummary();
      renderNavigation();
      renderBedTabs();
    }

    function refreshGridButtons() {
      document.querySelectorAll(".bed-btn").forEach(btn => {
        const bedName = btn.textContent.trim();
        if (state.allocated.includes(bedName)) {
          btn.classList.add("selected");
        } else {
          btn.classList.remove("selected");
        }
      });
    }

    function updateAllocationSummary() {
      const el = document.getElementById("allocated-summary-text");
      if (!el) return;
      if (!state.allocated || state.allocated.length === 0) {
        el.textContent = "Allocated (0): None selected";
      } else {
        el.textContent = `Allocated (${state.allocated.length}): ${state.allocated.join(", ")}`;
      }
    }

    function toggleTrackingField(bed, field) {
      if (!state.configs[bed]) {
        state.configs[bed] = { ...DEFAULT_CONFIG };
      }
      state.configs[bed][field] = !state.configs[bed][field];
      saveState();
      renderBedTabs();
    }

    function getBedConfig(bed) {
      return state.configs[bed] || { ...DEFAULT_CONFIG };
    }

    function renderNavigation() {
      const nav = document.getElementById("navbar");
      nav.innerHTML = `
        <button id="btn-tab-allocation" class="active" onclick="showTab('allocation')">Beds</button>
      `;

      state.allocated.forEach(bed => {
        const safeId = bed.replace(/\s+/g, '');
        const btn = document.createElement("button");
        btn.id = `btn-tab-${safeId}`;
        btn.textContent = bed;
        btn.onclick = () => showTab(safeId);
        nav.appendChild(btn);
      });

      const summaryBtn = document.createElement("button");
      summaryBtn.id = "btn-tab-summary";
      summaryBtn.textContent = "Summary";
      summaryBtn.onclick = () => showTab('summary');
      nav.appendChild(summaryBtn);
    }

    function getTimeStamp() {
      const now = new Date();
      return `[${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}]`;
    }

    function renderBedTabs() {
      const container = document.getElementById("dynamic-bed-containers");
      const currentActive = document.querySelector('.tab-content.active');
      const activeId = currentActive ? currentActive.id : 'tab-allocation';
      container.innerHTML = "";

      state.allocated.forEach(bed => {
        const safeId = bed.replace(/\s+/g, '');
        if (!state.data[bed]) {
          state.data[bed] = {
            news: "",
            bowels: "",
            amysSacrumStatus: "Skin intact",
            amysSacrumNotes: "",
            amysLeftHeelStatus: "Skin intact",
            amysLeftHeelNotes: "",
            amysRightHeelStatus: "Skin intact",
            amysRightHeelNotes: "",
            amysOtherStatus: "Skin intact",
            amysOtherNotes: "",
            turning: "",
            lyingBP: "",
            standingBP: "",
            weight: "",
            fluidIn: "",
            fluidOut: "",
            bm: "",
            diet: "",
            events: ""
          };
        }
        if (!state.configs[bed]) {
          state.configs[bed] = { ...DEFAULT_CONFIG };
        }

        const d = state.data[bed];
        const cfg = state.configs[bed];

        const tabDiv = document.createElement("div");
        tabDiv.id = `tab-${safeId}`;
        tabDiv.className = `tab-content ${activeId === `tab-${safeId}` ? 'active' : ''}`;

        tabDiv.innerHTML = `
          <div class="card">
            <h2>${bed} Entry Log</h2>

            <!-- Required Fields Toggle Bar -->
            <div class="tracking-toggles">
              <small>Toggle Active Charts for ${bed}</small>
              <div class="toggle-chips">
                <button type="button" class="toggle-chip ${cfg.news ? 'active' : ''}" onclick="toggleTrackingField('${bed}', 'news')">
                  ${cfg.news ? '✓' : '+'} NEWS2
                </button>
                <button type="button" class="toggle-chip ${cfg.bowels ? 'active' : ''}" onclick="toggleTrackingField('${bed}', 'bowels')">
                  ${cfg.bowels ? '✓' : '+'} Bowels
                </button>
                <button type="button" class="toggle-chip ${cfg.amys ? 'active' : ''}" onclick="toggleTrackingField('${bed}', 'amys')">
                  ${cfg.amys ? '✓' : '+'} Amy's Round
                </button>
                <button type="button" class="toggle-chip ${cfg.turning ? 'active' : ''}" onclick="toggleTrackingField('${bed}', 'turning')">
                  ${cfg.turning ? '✓' : '+'} Turning
                </button>
                <button type="button" class="toggle-chip ${cfg.lsbp ? 'active' : ''}" onclick="toggleTrackingField('${bed}', 'lsbp')">
                  ${cfg.lsbp ? '✓' : '+'} Lying/Standing BP
                </button>
                <button type="button" class="toggle-chip ${cfg.weight ? 'active' : ''}" onclick="toggleTrackingField('${bed}', 'weight')">
                  ${cfg.weight ? '✓' : '+'} Weight
                </button>
                <button type="button" class="toggle-chip ${cfg.fluids ? 'active' : ''}" onclick="toggleTrackingField('${bed}', 'fluids')">
                  ${cfg.fluids ? '✓' : '+'} Fluid Balance
                </button>
                <button type="button" class="toggle-chip ${cfg.diet ? 'active' : ''}" onclick="toggleTrackingField('${bed}', 'diet')">
                  ${cfg.diet ? '✓' : '+'} Food & Diet
                </button>
                <button type="button" class="toggle-chip ${cfg.bm ? 'active' : ''}" onclick="toggleTrackingField('${bed}', 'bm')">
                  ${cfg.bm ? '✓' : '+'} BM (Glucose)
                </button>
                <button type="button" class="toggle-chip ${cfg.events ? 'active' : ''}" onclick="toggleTrackingField('${bed}', 'events')">
                  ${cfg.events ? '✓' : '+'} Notes & Events
                </button>
              </div>
            </div>

            <!-- NEWS2 -->
            ${cfg.news ? `
            <div class="field-row">
              <label>NEWS2 / Observations & Time</label>
              <input type="text" placeholder="e.g. 08:30 NEWS: 1 (Pulse 96)" 
                value="${d.news || ''}" 
                oninput="updateField('${bed}', 'news', this.value)">
            </div>` : ''}

            <!-- Bowel Movement -->
            ${cfg.bowels ? `
            <div class="field-row">
              <label>Bowel Movement & Bristol Stool Scale</label>
              <div style="display: flex; gap: 8px; margin-bottom: 6px;">
                <select onchange="appendBristol('${bed}', this.value)">
                  <option value="">+ Add Bristol Type...</option>
                  <option value="Type 1">Type 1 (Hard lumps)</option>
                  <option value="Type 2">Type 2 (Lumpy sausage)</option>
                  <option value="Type 3">Type 3 (Cracked sausage)</option>
                  <option value="Type 4">
