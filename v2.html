<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thorndon Ward ICA Log</title>
  <style>
    :root {
      --ward-blue: #0b4d7a;
      --nhs-blue: #005eb8;
      --nhs-grey: #425563;
      --nhs-light-grey: #f0f4f5;
      --nhs-white: #ffffff;
      --nhs-border: #d8dde0;
      --nhs-text: #212b32;
      --nhs-red-bg: #fce8e6;
      --nhs-red-text: #c5221f;
      --nhs-red-border: #f5c2be;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--nhs-white);
      color: var(--nhs-text);
      line-height: 1.4;
      padding-bottom: 85px;
    }

    header {
      background-color: var(--ward-blue);
      color: var(--nhs-white);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.2;
    }

    header p {
      font-size: 0.72rem;
      opacity: 0.85;
      margin-top: 2px;
    }

    .status-badge {
      font-size: 0.75rem;
      background-color: rgba(255, 255, 255, 0.2);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 500;
    }

    nav {
      background: var(--nhs-white);
      border-bottom: 1px solid var(--nhs-border);
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      position: sticky;
      top: 54px;
      z-index: 99;
      -webkit-overflow-scrolling: touch;
    }

    nav button {
      background: none;
      border: none;
      padding: 12px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--nhs-grey);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      flex-shrink: 0;
    }

    nav button.active {
      color: var(--ward-blue);
      border-bottom-color: var(--ward-blue);
    }

    .container {
      padding: 16px;
      max-width: 760px;
      margin: 0 auto;
    }

    .intro-text {
      font-size: 0.85rem;
      color: var(--nhs-grey);
      margin-bottom: 4px;
    }

    .allocated-summary {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--nhs-text);
      margin-bottom: 14px;
    }

    .bed-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .bed-btn {
      background: var(--nhs-white);
      border: 1px solid var(--nhs-border);
      border-radius: 8px;
      padding: 13px 8px;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--nhs-text);
      cursor: pointer;
      text-align: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .bed-btn.selected {
      background: var(--nhs-blue);
      color: var(--nhs-white);
      border-color: var(--nhs-blue);
      font-weight: 700;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--nhs-white);
      border-top: 1px solid var(--nhs-border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      max-width: 760px;
      margin: 0 auto;
    }

    .btn-clear {
      background: var(--nhs-red-bg);
      color: var(--nhs-red-text);
      border: 1px solid var(--nhs-red-border);
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-handover {
      background: var(--ward-blue);
      color: var(--nhs-white);
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .card {
      background: var(--nhs-white);
      border: 1px solid var(--nhs-border);
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .card h2 {
      font-size: 1.05rem;
      margin-bottom: 12px;
      color: var(--ward-blue);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tracking-toggles {
      background: var(--nhs-light-grey);
      border: 1px solid var(--nhs-border);
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 16px;
    }

    .tracking-toggles small {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--nhs-grey);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .toggle-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .toggle-chip {
      background: var(--nhs-white);
      border: 1px solid var(--nhs-border);
      color: var(--nhs-grey);
      border-radius: 16px;
      padding: 6px 11px;
      font-size: 0.78rem;
      cursor: pointer;
    }

    .toggle-chip.active {
      background: var(--ward-blue);
      color: var(--nhs-white);
      border-color: var(--ward-blue);
      font-weight: 600;
    }

    .field-row {
      margin-bottom: 14px;
      background: #fff;
      border: 1px solid var(--nhs-border);
      padding: 12px;
      border-radius: 6px;
    }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--nhs-grey);
      text-transform: uppercase;
    }

    input, select, textarea {
      width: 100%;
      padding: 9px;
      border: 1px solid var(--nhs-border);
      border-radius: 4px;
      font-size: 0.92rem;
      background: var(--nhs-white);
    }

    .area-grid {
      display: grid;
      grid-template-columns: 130px 1fr 1.2fr;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    @media (max-width: 600px) {
      .area-grid {
        grid-template-columns: 1fr;
        gap: 5px;
        margin-bottom: 12px;
        background: var(--nhs-light-grey);
        padding: 8px;
        border-radius: 4px;
      }
    }

    .btn-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .chip-btn {
      background: var(--nhs-light-grey);
      border: 1px solid var(--nhs-border);
      border-radius: 16px;
      padding: 6px 11px;
      font-size: 0.78rem;
      cursor: pointer;
    }

    .chip-btn:active {
      background: var(--ward-blue);
      color: var(--nhs-white);
    }

    .secondary-btn {
      background-color: var(--nhs-white);
      color: var(--ward-blue);
      border: 1px solid var(--ward-blue);
      padding: 7px 12px;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
    }

    .copy-block {
      background: #fafafa;
      border-left: 3px solid var(--ward-blue);
      padding: 12px;
      font-family: monospace;
      font-size: 0.84rem;
      white-space: pre-wrap;
      margin-bottom: 12px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Thorndon Ward ICA Log</h1>
      <p>Offline Shift Notepad • SystmOne Staging</p>
    </div>
    <span class="status-badge" id="save-status">Auto-Saved</span>
  </header>

  <nav id="navbar">
    <button class="active" id="btn-tab-allocation" onclick="showTab('allocation')">Beds</button>
    <button id="btn-tab-summary" onclick="showTab('summary')">Summary</button>
  </nav>

  <div class="container">
    
    <div id="tab-allocation" class="tab-content active">
      <p class="intro-text">Tap beds to allocate to your shift. Tap an allocated bed to open its note.</p>
      <div class="allocated-summary" id="allocated-summary-text">Allocated (0): None selected</div>

      <div class="bed-grid" id="bed-grid-buttons">
        <button type="button" class="bed-btn" onclick="handleBedTap('Bay 1 Bed 1')">Bay 1 Bed 1</button>
        <button type="button" class="bed-btn" onclick="handleBedTap('Bay 1 Bed 2')">Bay 1 Bed 2</button>
        <button type="button" class="bed-btn" onclick="handleBedTap('Bay 2 Bed 1')">Bay 2 Bed 1</button>
        <button type="button" class="bed-btn" onclick="handleBedTap('Bay 2 Bed 2')">Bay 2 Bed 2</button>
        <button type="button" class="bed-btn" onclick="handleBedTap('Bay 2 Bed 3')">Bay 2 Bed 3</button>
        <button type="button" class="bed-btn" onclick="handleBedTap('Bay 2 Bed 4')">Bay 2 Bed 4</button>
        <button type="button" class="bed-btn" onclick="handleBedTap('Bay 3 Bed 1')">Bay 3 Bed 1</button>
        <button type="button" class="bed-btn" onclick="handleBedTap('Bay 3 Bed 2')">Bay 3 Bed 2</button>
        <button type="button" class="bed-btn" onclick="handleBedTap('Bay 3 Bed 3')">Bay 3 Bed 3</button>
        <button type="button" class="bed-btn" onclick="handleBedTap('Bay 3 Bed 4')">Bay 3 Bed 4</button>
        <button type="button" class="bed-btn" onclick="handleBedTap('Bay 4 Bed 1')">Bay 4 Bed 1</button>
        <button type="button" class="bed-btn" onclick="handleBedTap('Bay 4 Bed 2')">Bay 4 Bed 2</button>
        <button type="button" class="bed-btn" onclick="handleBedTap('Bay 4 Bed 3')">Bay 4 Bed 3</button>
        <button type="button" class="bed-btn" onclick="handleBedTap('Bay 4 Bed 4')">Bay 4 Bed 4</button>
        <button type="button" class="bed-btn" onclick="handleBedTap('Bay 5 Bed 1')">Bay 5 Bed 1</button>
        <button type="button" class="bed-btn" onclick="handleBedTap('Bay 5 Bed 2')">Bay 5 Bed 2</button>
        <button type="button" class="bed-btn" onclick="handleBedTap('Bay 5 Bed 3')">Bay 5 Bed 3</button>
        <button type="button" class="bed-btn" onclick="handleBedTap('Bay 5 Bed 4')">Bay 5 Bed 4</button>
        <button type="button" class="bed-btn" onclick="handleBedTap('Side Room 1')">Side Room 1</button>
        <button type="button" class="bed-btn" onclick="handleBedTap('Side Room 2')">Side Room 2</button>
        <button type="button" class="bed-btn" onclick="handleBedTap('Side Room 3')">Side Room 3</button>
        <button type="button" class="bed-btn" onclick="handleBedTap('Side Room 4')">Side Room 4</button>
        <button type="button" class="bed-btn" onclick="handleBedTap('Side Room 5')">Side Room 5</button>
        <button type="button" class="bed-btn" onclick="handleBedTap('Side Room 6')">Side Room 6</button>
        <button type="button" class="bed-btn" onclick="handleBedTap('Side Room 7')">Side Room 7</button>
      </div>
    </div>

    <div id="dynamic-bed-containers"></div>

    <div id="tab-summary" class="tab-content">
      <div class="card">
        <h2>SystmOne Handover Summary</h2>
        <p style="font-size: 0.82rem; color: var(--nhs-grey); margin-bottom: 14px;">
          Review and copy figures straight into SystmOne when you log onto the laptop.
        </p>
        <div id="summary-cards"></div>
      </div>
    </div>

  </div>

  <div class="bottom-bar">
    <button type="button" class="btn-clear" onclick="clearShift()">Clear Shift</button>
    <button type="button" class="btn-handover" onclick="showTab('summary')">Copy Handover</button>
  </div>

  <script>
    var appState = {
      allocated: [],
      configs: {},
      data: {}
    };

    var BASE_CONFIG = {
      news: true,
      bowels: true,
      amys: false,
      turning: false,
      lsbp: false,
      weight: false,
      fluids: false,
      diet: false,
      bm: false,
      events: true
    };

    function safeInit() {
      try {
        var raw = localStorage.getItem("thorndon_v2_clean");
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && typeof parsed === "object") {
            appState.allocated = Array.isArray(parsed.allocated) ? parsed.allocated : [];
            appState.configs = parsed.configs || {};
            appState.data = parsed.data || {};
          }
        }
      } catch (err) {
        appState = { allocated: [], configs: {}, data: {} };
      }

      syncButtons();
      buildNav();
      buildBedLogs();
      syncSummaryText();
    }

    function persistState() {
      try {
        localStorage.setItem("thorndon_v2_clean", JSON.stringify(appState));
        var el = document.getElementById("save-status");
        if (el) {
          el.textContent = "Saved";
          setTimeout(function() { el.textContent = "Auto-Saved"; }, 1000);
        }
      } catch (err) {}
    }

    function handleBedTap(bedName) {
      if (!Array.isArray(appState.allocated)) appState.allocated = [];
      
      var idx = appState.allocated.indexOf(bedName);
      if (idx > -1) {
        var safeId = bedName.replace(/\s+/g, '');
        showTab(safeId);
      } else {
        appState.allocated.push(bedName);
        persistState();
        syncButtons();
        syncSummaryText();
        buildNav();
        buildBedLogs();
      }
    }

    function unallocateBed(bedName) {
      appState.allocated = appState.allocated.filter(function(b) { return b !== bedName; });
      persistState();
      syncButtons();
      syncSummaryText();
      buildNav();
      buildBedLogs();
      showTab('allocation');
    }

    function syncButtons() {
      var btns = document.querySelectorAll("#bed-grid-buttons .bed-btn");
      btns.forEach(function(btn) {
        var name = btn.textContent.replace('✓ ', '').trim();
        if (appState.allocated.indexOf(name) > -1) {
          btn.classList.add("selected");
          btn.textContent = "✓ " + name;
        } else {
          btn.classList.remove("selected");
          btn.textContent = name;
        }
      });
    }

    function syncSummaryText() {
      var el = document.getElementById("allocated-summary-text");
      if (!el) return;
      if (!appState.allocated || appState.allocated.length === 0) {
        el.textContent = "Allocated (0): None selected";
      } else {
        el.textContent = "Allocated (" + appState.allocated.length + "): " + appState.allocated.join(", ");
      }
    }

    function buildNav() {
      var nav = document.getElementById("navbar");
      nav.innerHTML = '<button id="btn-tab-allocation" class="active" onclick="showTab(\'allocation\')">Beds</button>';

      appState.allocated.forEach(function(bed) {
        var safeId = bed.replace(/\s+/g, '');
        var btn = document.createElement("button");
        btn.id = "btn-tab-" + safeId;
        btn.textContent = bed;
        btn.onclick = function() { showTab(safeId); };
        nav.appendChild(btn);
      });

      var summaryBtn = document.createElement("button");
      summaryBtn.id = "btn-tab-summary";
      summaryBtn.textContent = "Summary";
      summaryBtn.onclick = function() { showTab('summary'); };
      nav.appendChild(summaryBtn);
    }

    function getBedCfg(bed) {
      if (!appState.configs[bed]) {
        appState.configs[bed] = Object.assign({}, BASE_CONFIG);
      }
      return appState.configs[bed];
    }

    function toggleChartField(bed, field) {
      var cfg = getBedCfg(bed);
      cfg[field] = !cfg[field];
      persistState();
      buildBedLogs();
    }

    function buildBedLogs() {
      var container = document.getElementById("dynamic-bed-containers");
      var currentActive = document.querySelector('.tab-content.active');
      var activeId = currentActive ? currentActive.id : 'tab-allocation';
      container.innerHTML = "";

      appState.allocated.forEach(function(bed) {
        var safeId = bed.replace(/\s+/g, '');
        if (!appState.data[bed]) {
          appState.data[bed] = {
            news: "", bowels: "", amysSacrumStatus: "Skin intact", amysSacrumNotes: "",
            amysLeftHeelStatus: "Skin intact", amysLeftHeelNotes: "", amysRightHeelStatus: "Skin intact",
            amysRightHeelNotes: "", amysOtherStatus: "Skin intact", amysOtherNotes: "",
            turning: "", lyingBP: "", standingBP: "", weight: "", fluidIn: "", fluidOut: "",
            bm: "", diet: "", events: ""
          };
        }

        var d = appState.data[bed];
        var cfg = getBedCfg(bed);

        var tabDiv = document.createElement("div");
        tabDiv.id = "tab-" + safeId;
        tabDiv.className = "tab-content " + (activeId === ("tab-" + safeId) ? "active" : "");

        tabDiv.innerHTML = [
          '<div class="card">',
            '<h2>',
              '<span>' + bed + ' Entry Log</span>',
              '<button type="button" class="secondary-btn" style="color:var(--nhs-red-text);border-color:var(--nhs-red-border);" onclick="unallocateBed(\'' + bed + '\')">Remove Bed</button>',
            '</h2>',

            '<div class="tracking-toggles">',
              '<small>Toggle Active Charts for ' + bed + '</small>',
              '<div class="toggle-chips">',
                '<button type="button" class="toggle-chip ' + (cfg.news ? 'active' : '') + '" onclick="toggleChartField(\'' + bed + '\', \'news\')">' + (cfg.news ? '✓' : '+') + ' NEWS2</button>',
                '<button type="button" class="toggle-chip ' + (cfg.bowels ? 'active' : '') + '" onclick="toggleChartField(\'' + bed + '\', \'bowels\')">' + (cfg.bowels ? '✓' : '+') + ' Bowels</button>',
                '<button type="button" class="toggle-chip ' + (cfg.amys ? 'active' : '') + '" onclick="toggleChartField(\'' + bed + '\', \'amys\')">' + (cfg.amys ? '✓' : '+') + ' Amy\'s Round</button>',
                '<button type="button" class="toggle-chip ' + (cfg.turning ? 'active' : '') + '" onclick="toggleChartField(\'' + bed + '\', \'turning\')">' + (cfg.turning ? '✓' : '+') + ' Turning</button>',
                '<button type="button" class="toggle-chip ' + (cfg.lsbp ? 'active' : '') + '" onclick="toggleChartField(\'' + bed + '\', \'lsbp\')">' + (cfg.lsbp ? '✓' : '+') + ' Lying/Standing BP</button>',
                '<button type="button" class="toggle-chip ' + (cfg.weight ? 'active' : '') + '" onclick="toggleChartField(\'' + bed + '\', \'weight\')">' + (cfg.weight ? '✓' : '+') + ' Weight</button>',
                '<button type="button" class="toggle-chip ' + (cfg.fluids ? 'active' : '') + '" onclick="toggleChartField(\'' + bed + '\', \'fluids\')">' + (cfg.fluids ? '✓' : '+') + ' Fluid Balance</button>',
                '<button type="button" class="toggle-chip ' + (cfg.diet ? 'active' : '') + '" onclick="toggleChartField(\'' + bed + '\', \'diet\')">' + (cfg.diet ? '✓' : '+') + ' Food & Diet</button>',
                '<button type="button" class="toggle-chip ' + (cfg.bm ? 'active' : '') + '" onclick="toggleChartField(\'' + bed + '\', \'bm\')">' + (cfg.bm ? '✓' : '+') + ' BM (Glucose)</button>',
                '<button type="button" class="toggle-chip ' + (cfg.events ? 'active' : '') + '" onclick="toggleChartField(\'' + bed + '\', \'events\')">' + (cfg.events ? '✓' : '+') + ' Notes</button>',
              '</div>',
            '</div>',

            cfg.news ? [
              '<div class="field-row">',
                '<label>NEWS2 / Observations & Time</label>',
                '<input type="text" placeholder="e.g. 08:30 NEWS: 1 (Pulse 96)" value="' + (d.news || '') + '" oninput="saveBedVal(\'' + bed + '\', \'news\', this.value)">',
              '</div>'
            ].join('') : '',

            cfg.bowels ? [
              '<div class="field-row">',
                '<label>Bowel Movement & Bristol Stool Scale</label>',
                '<div style="display:flex;gap:8px;margin-bottom:6px;">',
                  '<select onchange="addBristol(\'' + bed + '\', this.value)">',
                    '<option value="">+ Add Bristol Type...</option>',
                    '<option value="Type 1">Type 1 (Hard lumps)</option>',
                    '<option value="Type 2">Type 2 (Lumpy sausage)</option>',
                    '<option value="Type 3">Type 3 (Cracked sausage)</option>',
                    '<option value="Type 4">Type 4 (Smooth, soft)</option>',
                    '<option value="Type 5">Type 5 (Soft blobs)</option>',
                    '<option value="
