<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thorndon Ward ICA Log - v2.13</title>
  <style>
    :root {
      --ward: #0b4d7a;
      --blue: #005eb8;
      --grey: #425563;
      --light: #f0f4f5;
      --border: #d8dde0;
      --text: #212b32;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: #fff; color: var(--text); padding-bottom: 85px; }
    header { background: var(--ward); color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    header h1 { font-size: 1.05rem; font-weight: 700; }
    header p { font-size: 0.72rem; opacity: 0.85; margin-top: 2px; }
    .badge { font-size: 0.75rem; background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 12px; }
    nav { background: #fff; border-bottom: 1px solid var(--border); display: flex; overflow-x: auto; position: sticky; top: 54px; z-index: 99; white-space: nowrap; -webkit-overflow-scrolling: touch; }
    nav button { background: none; border: none; padding: 12px 14px; font-size: 0.85rem; font-weight: 600; color: var(--grey); cursor: pointer; border-bottom: 3px solid transparent; flex-shrink: 0; }
    nav button.active { color: var(--ward); border-bottom-color: var(--ward); }
    .container { padding: 16px; max-width: 760px; margin: 0 auto; }
    .bed-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .bed-btn { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 12px 4px; font-size: 0.82rem; font-weight: 600; color: var(--text); cursor: pointer; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bed-btn.selected { background: var(--blue) !important; color: #fff !important; border-color: var(--blue) !important; }
    .card { background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 16px; margin-bottom: 16px; }
    .card h2 { font-size: 1.05rem; margin-bottom: 12px; color: var(--ward); display: flex; justify-content: space-between; align-items: center; }
    .field-row { margin-bottom: 14px; background: #fafafa; border: 1px solid var(--border); padding: 12px; border-radius: 6px; }
    label { display: block; font-size: 0.78rem; font-weight: 700; margin-bottom: 6px; color: var(--grey); text-transform: uppercase; }
    input, select, textarea { width: 100%; padding: 9px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.9rem; background: #fff; }
    .area-grid { display: grid; grid-template-columns: 110px 1fr 1fr; gap: 6px; align-items: center; margin-bottom: 8px; }
    @media(max-width:600px) { .area-grid { grid-template-columns: 1fr; background: var(--light); padding: 8px; border-radius: 4px; } }
    .btn-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
    .action-chip { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 6px 12px; font-size: 0.78rem; cursor: pointer; font-weight: 500; }
    .action-chip:active { background: var(--ward); color: #fff; }
    .sec-btn { background: #fff; color: var(--ward); border: 1px solid var(--ward); padding: 6px 12px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; font-weight: 600; }
    .btn-clear { background: #fce8e6; color: #c5221f; border: 1px solid #f5c2be; border-radius: 6px; padding: 9px 16px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--border); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 100; max-width: 760px; margin: 0 auto; box-shadow: 0 -2px 5px rgba(0,0,0,0.05); }
    .copy-block { background: #fafafa; border-left: 3px solid var(--ward); padding: 10px; font-family: monospace; font-size: 0.82rem; white-space: pre-wrap; margin-bottom: 12px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
  <script>
    var BEDS = [
      "Bay 1 Bed 1", "Bay 1 Bed 2", "Bay 2 Bed 1", "Bay 2 Bed 2", "Bay 2 Bed 3", "Bay 2 Bed 4",
      "Bay 3 Bed 1", "Bay 3 Bed 2", "Bay 3 Bed 3", "Bay 3 Bed 4", "Bay 4 Bed 1", "Bay 4 Bed 2",
      "Bay 4 Bed 3", "Bay 4 Bed 4", "Bay 5 Bed 1", "Bay 5 Bed 2", "Bay 5 Bed 3", "Bay 5 Bed 4",
      "Side Room 1", "Side Room 2", "Side Room 3", "Side Room 4", "Side Room 5", "Side Room 6", "Side Room 7"
    ];

    var state = { allocated: [], data: {} };

    function saveState() {
      try { localStorage.setItem("thorndon_v213", JSON.stringify(state)); } catch(e){}
      var s = document.getElementById("save-status");
      if (s) { s.textContent = "Saved"; setTimeout(function(){ s.textContent = "Auto-Saved"; }, 600); }
    }

    function loadState() {
      try {
        var raw = localStorage.getItem("thorndon_v213");
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && typeof parsed === "object") {
            state.allocated = Array.isArray(parsed.allocated) ? parsed.allocated : [];
            state.data = parsed.data || {};
          }
        }
      } catch(e){
        state = { allocated: [], data: {} };
      }
    }

    function toggleBed(bedName) {
      if (!Array.isArray(state.allocated)) state.allocated = [];
      var idx = state.allocated.indexOf(bedName);
      if (idx > -1) {
        state.allocated.splice(idx, 1);
      } else {
        state.allocated.push(bedName);
        if (!state.data[bedName]) {
          state.data[bedName] = { amysSacrumStatus: 'Skin intact', amysLeftHeelStatus: 'Skin intact', amysRightHeelStatus: 'Skin intact', amysOtherStatus: 'Skin intact' };
        }
      }
      saveState();
      refreshUI();
    }

    function refreshUI() {
      var buttons = document.querySelectorAll(".bed-btn");
      buttons.forEach(function(b) {
        var name = b.getAttribute("data-bed");
        if (state.allocated.indexOf(name) > -1) {
          b.className = "bed-btn selected";
          b.textContent = "✓ " + name;
        } else {
          b.className = "bed-btn";
          b.textContent = name;
        }
      });

      var el = document.getElementById("allocated-text");
      if (el) {
        el.textContent = state.allocated.length ? "Allocated (" + state.allocated.length + "): " + state.allocated.join(", ") : "Allocated (0): None selected";
      }

      renderNavAndTabs();
    }

    function renderNavAndTabs() {
      var nav = document.getElementById("dynamic-nav");
      var container = document.getElementById("dynamic-tabs-container");
      if (!nav || !container) return;

      var activeTabId = document.querySelector(".tab-content.active") ? document.querySelector(".tab-content.active").id : "tab-allocation";

      nav.innerHTML = '<button class="active" id="btn-tab-allocation" onclick="switchTab(\'allocation\')">Beds</button>';
      
      // Keep static allocation view wrapper in container, rebuild bed tabs
      var allocationHTML = document.getElementById("tab-allocation") ? document.getElementById("tab-allocation").outerHTML : '';
      var summaryHTML = document.getElementById("tab-summary") ? document.getElementById("tab-summary").outerHTML : '';
      
      if (!allocationHTML) {
        allocationHTML = '<div id="tab-allocation" class="tab-content active"><p style="font-size:0.85rem;color:var(--grey);">Tap beds to allocate to your shift. Tapping creates their tab in the top bar.</p><div style="font-size:0.9rem;font-weight:700;margin-top:4px;" id="allocated-text">Allocated (0): None selected</div><div class="bed-grid" id="mainBedGrid"></div></div>';
      }
      if (!summaryHTML) {
        summaryHTML = '<div id="tab-summary" class="tab-content"><div class="card"><h2>SystmOne Handover Summary</h2><div id="summary-cards"></div></div></div>';
      }

      container.innerHTML = allocationHTML + summaryHTML;

      var grid = document.getElementById("mainBedGrid");
      if (grid && grid.children.length === 0) {
        BEDS.forEach(function(bedName) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "bed-btn";
          btn.setAttribute("data-bed", bedName);
          btn.textContent = bedName;
          btn.onclick = function() { toggleBed(bedName); };
          grid.appendChild(btn);
        });
      }

      state.allocated.forEach(function(bed) {
        var safeId = bed.replace(/[^a-zA-Z0-9]/g, '');
        
        var btn = document.createElement("button");
        btn.id = "btn-tab-" + safeId;
        btn.textContent = bed;
        btn.onclick = function() { switchTab(safeId); };
        nav.appendChild(btn);

        var d = state.data[bed] || { amysSacrumStatus: 'Skin intact', amysLeftHeelStatus: 'Skin intact', amysRightHeelStatus: 'Skin intact', amysOtherStatus: 'Skin intact' };
        var tabDiv = document.createElement("div");
        tabDiv.id = "tab-" + safeId;
        tabDiv.className = "tab-content";
        tabDiv.innerHTML = `
          <div class="card">
            <h2>
              <span>${bed} Entry Log</span>
              <button type="button" class="sec-btn" onclick="switchTab('allocation')">Back to Beds</button>
            </h2>

            <div class="field-row">
              <label>NEWS2 / Observations & Time</label>
              <input type="text" placeholder="e.g. 08:30 NEWS: 1 (Pulse 96)" value="${d.news || ''}" oninput="updateData('${bed}', 'news', this.value)">
            </div>

            <div class="field-row">
              <label>Bowel Movement & Bristol Stool Scale</label>
              <div style="display:flex;gap:6px;margin-bottom:6px;">
                <select onchange="addBristol('${bed}', this.value); this.value='';">
                  <option value="">+ Add Bristol Type...</option>
                  <option value="Type 1">Type 1 (Hard lumps)</option>
                  <option value="Type 2">Type 2 (Lumpy sausage)</option>
                  <option value="Type 3">Type 3 (Cracked sausage)</option>
                  <option value="Type 4">Type 4 (Smooth, soft)</option>
                  <option value="Type 5">Type 5 (Soft blobs)</option>
                  <option value="Type 6">Type 6 (Mushy)</option>
                  <option value="Type 7">Type 7 (Liquid)</option>
                </select>
                <button type="button" class="sec-btn" onclick="updateData('${bed}', 'bowels', 'Not opened this shift'); document.getElementById('bowel-${safeId}').value='Not opened this shift';">BO Not Opened</button>
              </div>
              <input type="text" id="bowel-${safeId}" placeholder="e.g. BO x1 Type 4" value="${d.bowels || ''}" oninput="updateData('${bed}', 'bowels', this.value)">
            </div>

            <div class="field-row">
              <label>Amy's Round (Pressure Areas)</label>
              <div class="area-grid">
                <strong>Sacrum</strong>
                <select onchange="updateData('${bed}', 'amysSacrumStatus', this.value)">
                  <option ${d.amysSacrumStatus==='Skin intact'?'selected':''}>Skin intact</option>
                  <option ${d.amysSacrumStatus==='Blanching redness'?'selected':''}>Blanching redness</option>
                  <option ${d.amysSacrumStatus==='Non-blanching redness'?'selected':''}>Non-blanching redness</option>
                  <option ${d.amysSacrumStatus==='Moisture lesion'?'selected':''}>Moisture lesion</option>
                  <option ${d.amysSacrumStatus==='Dressing intact'?'selected':''}>Dressing intact</option>
                  <option ${d.amysSacrumStatus==='Broken skin'?'selected':''}>Broken skin</option>
                </select>
                <input type="text" placeholder="Sacrum notes" value="${d.amysSacrumNotes || ''}" oninput="updateData('${bed}', 'amysSacrumNotes', this.value)">
              </div>
              <div class="area-grid">
                <strong>Left Heel</strong>
                <select onchange="updateData('${bed}', 'amysLeftHeelStatus', this.value)">
                  <option ${d.amysLeftHeelStatus==='Skin intact'?'selected':''}>Skin intact</option>
                  <option ${d.amysLeftHeelStatus==='Blanching redness'?'selected':''}>Blanching redness</option>
                  <option ${d.amysLeftHeelStatus==='Offloaded on pillow'?'selected':''}>Offloaded on pillow</option>
                  <option ${d.amysLeftHeelStatus==='Broken skin'?'selected':''}>Broken skin</option>
                </select>
                <input type="text" placeholder="Left heel notes" value="${d.amysLeftHeelNotes || ''}" oninput="updateData('${bed}', 'amysLeftHeelNotes', this.value)">
              </div>
              <div class="area-grid">
                <strong>Right Heel</strong>
                <select onchange="updateData('${bed}', 'amysRightHeelStatus', this.value)">
                  <option ${d.amysRightHeelStatus==='Skin intact'?'selected':''}>Skin intact</option>
                  <option ${d.amysRightHeelStatus==='Blanching redness'?'selected':''}>Blanching redness</option>
                  <option ${d.amysRightHeelStatus==='Offloaded on pillow'?'selected':''}>Offloaded on pillow</option>
                  <option ${d.amysRightHeelStatus==='Broken skin'?'selected':''}>Broken skin</option>
                </select>
                <input type="text" placeholder="Right heel notes" value="${d.amysRightHeelNotes || ''}" oninput="updateData('${bed}', 'amysRightHeelNotes', this.value)">
              </div>
              <div class="area-grid">
                <strong>Other/Buttocks</strong>
                <select onchange="updateData('${bed}', 'amysOtherStatus', this.value)">
                  <option ${d.amysOtherStatus==='Skin intact'?'selected':''}>Skin intact</option>
                  <option ${d.amysOtherStatus==='Blanching redness'?'selected':''}>Blanching redness</option>
                  <option ${d.amysOtherStatus==='Moisture lesion'?'selected':''}>Moisture lesion</option>
                  <option ${d.amysOtherStatus==='Broken skin'?'selected':''}>Broken skin</option>
                </select>
                <input type="text" placeholder="Details" value="${d.amysOtherNotes || ''}" oninput="updateData('${bed}', 'amysOtherNotes', this.value)">
              </div>
            </div>

            <div class="field-row">
              <label>Turning & Repositioning Chart</label>
              <div class="btn-row">
                <button type="button" class="action-chip" onclick="addTurn('${bed}', 'Left side')">+ Left Side</button>
                <button type="button" class="action-chip" onclick="addTurn('${bed}', 'Right side')">+ Right Side</button>
                <button type="button" class="action-chip" onclick="addTurn('${bed}', 'Supine')">+ Supine</button>
                <button type="button" class="action-chip" onclick="addTurn('${bed}', 'Sitting in chair')">+ Sitting in chair</button>
              </div>
              <textarea rows="3" id="turn-${safeId}" placeholder="Tapping position stamps time..." oninput="updateData('${bed}', 'turning', this.value)">${d.turning || ''}</textarea>
            </div>

            <div class="field-row">
              <label>Lying & Standing Blood Pressure</label>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                <div><small style="font-weight:700;color:var(--grey);">Lying BP</small><input type="text" placeholder="e.g. 132/78" value="${d.lyingBP || ''}" oninput="updateData('${bed}', 'lyingBP', this.value)"></div>
                <div><small style="font-weight:700;color:var(--grey);">Standing BP</small><input type="text" placeholder="e.g. 118/72" value="${d.standingBP || ''}" oninput="updateData('${bed}', 'standingBP', this.value)"></div>
              </div>
            </div>

            <div class="field-row">
              <label>Weight (kg)</label>
              <input type="text" placeholder="e.g. 68.4 kg" value="${d.weight || ''}" oninput="updateData('${bed}', 'weight', this.value)">
            </div>

            <div class="field-row">
              <label>Fluid Intake (ml)</label>
              <div class="btn-row">
                <button type="button" class="action-chip" onclick="addFluidIn('${bed}', 150)">+150ml (Cup)</button>
                <button type="button" class="action-chip" onclick="addFluidIn('${bed}', 200)">+200ml (Mug)</button>
                <button type="button" class="action-chip" onclick="addFluidIn('${bed}', 500)">+500ml (Jug)</button>
              </div>
              <input type="text" id="fluidin-${safeId}" placeholder="e.g. 650ml oral fluids" value="${d.fluidIn || ''}" oninput="updateData('${bed}', 'fluidIn', this.value)">
              <label style="margin-top:8px;">Fluid Output / Urine</label>
              <div class="btn-row">
                <button type="button" class="action-chip" onclick="addFluidOut('${bed}', 'Pad wet x1')">+ Pad Wet</button>
                <button type="button" class="action-chip" onclick="addFluidOut('${bed}', 'PU urinal 250ml')">+ 250ml Urinal</button>
                <button type="button" class="action-chip" onclick="addFluidOut('${bed}', 'Catheter emptied 400ml')">+ 400ml Catheter</button>
              </div>
              <input type="text" id="fluidout-${safeId}" placeholder="e.g. Catheter 500ml clear amber" value="${d.fluidOut || ''}" oninput="updateData('${bed}', 'fluidOut', this.value)">
            </div>

            <div class="field-row">
              <label>Food & Diet Intake</label>
              <div class="btn-row">
                <button type="button" class="action-chip" onclick="addDiet('${bed}', 'Breakfast 100%')">Breakfast 100%</button>
                <button type="button" class="action-chip" onclick="addDiet('${bed}', 'Lunch 50%')">Lunch 50%</button>
                <button type="button" class="action-chip" onclick="addDiet('${bed}', 'Refused meal')">Refused</button>
              </div>
              <input type="text" id="diet-${safeId}" placeholder="e.g. Lunch 75% taken well" value="${d.diet || ''}" oninput="updateData('${bed}', 'diet', this.value)">
            </div>

            <div class="field-row">
              <label>Blood Glucose (BM)</label>
              <input type="text" placeholder="e.g. 07:45 BM: 6.8 mmol/L" value="${d.bm || ''}" oninput="updateData('${bed}', 'bm', this.value)">
            </div>

            <div class="field-row">
              <label>General Notes, Specimens & Events</label>
              <button type="button" class="sec-btn" style="margin-bottom:6px;" onclick="insertTime('${bed}')">+ Insert Time</button>
              <textarea rows="3" id="events-${safeId}" placeholder="Click + Insert Time to stamp quick notes..." oninput="updateData('${bed}', 'events', this.value)">${d.events || ''}</textarea>
            </div>
          </div>
        `;
        container.appendChild(tabDiv);
      });

      var summaryBtn = document.createElement("button");
      summaryBtn.id = "btn-tab-summary";
      summaryBtn.textContent = "Summary";
      summaryBtn.onclick = function() { switchTab('summary'); };
      nav.appendChild(summaryBtn);

      var checkTarget = document.getElementById(activeTabId);
      switchTab(checkTarget ? activeTabId : "tab-allocation");
      refreshUIOnly();
    }

    function refreshUIOnly() {
      var buttons = document.querySelectorAll(".bed-btn");
      buttons.forEach(function(b) {
        var name = b.getAttribute("data-bed");
        if (state.allocated.indexOf(name) > -1) {
          b.className = "bed-btn selected";
          b.textContent = "✓ " + name;
        } else {
          b.className = "bed-btn";
          b.textContent = name;
        }
      });
      var el = document.getElementById("allocated-te
