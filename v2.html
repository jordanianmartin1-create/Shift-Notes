<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thorndon Ward ICA Log</title>
  <style>
    :root {
      --ward-blue: #0b4d7a;
      --nhs-blue: #005eb8;
      --nhs-grey: #425563;
      --nhs-light-grey: #f0f4f5;
      --nhs-white: #ffffff;
      --nhs-border: #d8dde0;
      --nhs-text: #212b32;
      --nhs-red-bg: #fce8e6;
      --nhs-red-text: #c5221f;
      --nhs-red-border: #f5c2be;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--nhs-white);
      color: var(--nhs-text);
      line-height: 1.4;
      padding-bottom: 90px;
    }

    header {
      background-color: var(--ward-blue);
      color: var(--nhs-white);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.2;
    }

    header p {
      font-size: 0.72rem;
      opacity: 0.9;
      margin-top: 2px;
      font-weight: 600;
      color: #79d2a6;
    }

    .status-badge {
      font-size: 0.75rem;
      background-color: rgba(255, 255, 255, 0.2);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 500;
    }

    nav {
      background: var(--nhs-white);
      border-bottom: 1px solid var(--nhs-border);
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      position: sticky;
      top: 54px;
      z-index: 99;
      -webkit-overflow-scrolling: touch;
    }

    nav button {
      background: none;
      border: none;
      padding: 12px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--nhs-grey);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      flex-shrink: 0;
    }

    nav button.active {
      color: var(--ward-blue);
      border-bottom-color: var(--ward-blue);
    }

    .container {
      padding: 16px;
      max-width: 760px;
      margin: 0 auto;
    }

    .intro-text {
      font-size: 0.85rem;
      color: var(--nhs-grey);
      margin-bottom: 4px;
    }

    .allocated-summary {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--nhs-text);
      margin-bottom: 14px;
    }

    .bed-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .bed-btn {
      background: var(--nhs-white);
      border: 1px solid var(--nhs-border);
      border-radius: 8px;
      padding: 14px 8px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--nhs-text);
      cursor: pointer;
      text-align: center;
      touch-action: manipulation;
    }

    .bed-btn.selected {
      background: var(--nhs-blue) !important;
      color: var(--nhs-white) !important;
      border-color: var(--nhs-blue) !important;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--nhs-white);
      border-top: 1px solid var(--nhs-border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      max-width: 760px;
      margin: 0 auto;
    }

    .btn-clear {
      background: var(--nhs-red-bg);
      color: var(--nhs-red-text);
      border: 1px solid var(--nhs-red-border);
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-handover {
      background: var(--ward-blue);
      color: var(--nhs-white);
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .card {
      background: var(--nhs-white);
      border: 1px solid var(--nhs-border);
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .card h2 {
      font-size: 1.05rem;
      margin-bottom: 12px;
      color: var(--ward-blue);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tracking-toggles {
      background: var(--nhs-light-grey);
      border: 1px solid var(--nhs-border);
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 16px;
    }

    .tracking-toggles small {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--nhs-grey);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .toggle-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .toggle-chip {
      background: var(--nhs-white);
      border: 1px solid var(--nhs-border);
      color: var(--nhs-grey);
      border-radius: 16px;
      padding: 6px 11px;
      font-size: 0.78rem;
      cursor: pointer;
    }

    .toggle-chip.active {
      background: var(--ward-blue);
      color: var(--nhs-white);
      border-color: var(--ward-blue);
      font-weight: 600;
    }

    .field-row {
      margin-bottom: 14px;
      background: #fff;
      border: 1px solid var(--nhs-border);
      padding: 12px;
      border-radius: 6px;
    }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--nhs-grey);
      text-transform: uppercase;
    }

    input, select, textarea {
      width: 100%;
      padding: 9px;
      border: 1px solid var(--nhs-border);
      border-radius: 4px;
      font-size: 0.92rem;
      background: var(--nhs-white);
    }

    .area-grid {
      display: grid;
      grid-template-columns: 130px 1fr 1.2fr;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    @media (max-width: 600px) {
      .area-grid {
        grid-template-columns: 1fr;
        gap: 5px;
        margin-bottom: 12px;
        background: var(--nhs-light-grey);
        padding: 8px;
        border-radius: 4px;
      }
    }

    .btn-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .chip-btn {
      background: var(--nhs-light-grey);
      border: 1px solid var(--nhs-border);
      border-radius: 16px;
      padding: 6px 11px;
      font-size: 0.78rem;
      cursor: pointer;
    }

    .chip-btn:active {
      background: var(--ward-blue);
      color: var(--nhs-white);
    }

    .secondary-btn {
      background-color: var(--nhs-white);
      color: var(--ward-blue);
      border: 1px solid var(--ward-blue);
      padding: 7px 12px;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
    }

    .copy-block {
      background: #fafafa;
      border-left: 3px solid var(--ward-blue);
      padding: 12px;
      font-family: monospace;
      font-size: 0.84rem;
      white-space: pre-wrap;
      margin-bottom: 12px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Thorndon Ward ICA Log</h1>
      <p id="build-tag">● Build 2.2 Live</p>
    </div>
    <span class="status-badge" id="save-status">Ready</span>
  </header>

  <nav id="navbar">
    <button class="active" id="nav-btn-allocation" onclick="showTab('allocation')">Beds</button>
    <button id="nav-btn-summary" onclick="showTab('summary')">Summary</button>
  </nav>

  <div class="container">
    
    <div id="tab-allocation" class="tab-content active">
      <p class="intro-text">Tap beds to allocate to your shift. Tapping an allocated bed opens its note.</p>
      <div class="allocated-summary" id="allocated-summary-text">Allocated (0): None selected</div>

      <div class="bed-grid" id="bed-grid-buttons">
        <button type="button" class="bed-btn" onclick="onBedClick('Bay 1 Bed 1')">Bay 1 Bed 1</button>
        <button type="button" class="bed-btn" onclick="onBedClick('Bay 1 Bed 2')">Bay 1 Bed 2</button>
        <button type="button" class="bed-btn" onclick="onBedClick('Bay 2 Bed 1')">Bay 2 Bed 1</button>
        <button type="button" class="bed-btn" onclick="onBedClick('Bay 2 Bed 2')">Bay 2 Bed 2</button>
        <button type="button" class="bed-btn" onclick="onBedClick('Bay 2 Bed 3')">Bay 2 Bed 3</button>
        <button type="button" class="bed-btn" onclick="onBedClick('Bay 2 Bed 4')">Bay 2 Bed 4</button>
        <button type="button" class="bed-btn" onclick="onBedClick('Bay 3 Bed 1')">Bay 3 Bed 1</button>
        <button type="button" class="bed-btn" onclick="onBedClick('Bay 3 Bed 2')">Bay 3 Bed 2</button>
        <button type="button" class="bed-btn" onclick="onBedClick('Bay 3 Bed 3')">Bay 3 Bed 3</button>
        <button type="button" class="bed-btn" onclick="onBedClick('Bay 3 Bed 4')">Bay 3 Bed 4</button>
        <button type="button" class="bed-btn" onclick="onBedClick('Bay 4 Bed 1')">Bay 4 Bed 1</button>
        <button type="button" class="bed-btn" onclick="onBedClick('Bay 4 Bed 2')">Bay 4 Bed 2</button>
        <button type="button" class="bed-btn" onclick="onBedClick('Bay 4 Bed 3')">Bay 4 Bed 3</button>
        <button type="button" class="bed-btn" onclick="onBedClick('Bay 4 Bed 4')">Bay 4 Bed 4</button>
        <button type="button" class="bed-btn" onclick="onBedClick('Bay 5 Bed 1')">Bay 5 Bed 1</button>
        <button type="button" class="bed-btn" onclick="onBedClick('Bay 5 Bed 2')">Bay 5 Bed 2</button>
        <button type="button" class="bed-btn" onclick="onBedClick('Bay 5 Bed 3')">Bay 5 Bed 3</button>
        <button type="button" class="bed-btn" onclick="onBedClick('Bay 5 Bed 4')">Bay 5 Bed 4</button>
        <button type="button" class="bed-btn" onclick="onBedClick('Side Room 1')">Side Room 1</button>
        <button type="button" class="bed-btn" onclick="onBedClick('Side Room 2')">Side Room 2</button>
        <button type="button" class="bed-btn" onclick="onBedClick('Side Room 3')">Side Room 3</button>
        <button type="button" class="bed-btn" onclick="onBedClick('Side Room 4')">Side Room 4</button>
        <button type="button" class="bed-btn" onclick="onBedClick('Side Room 5')">Side Room 5</button>
        <button type="button" class="bed-btn" onclick="onBedClick('Side Room 6')">Side Room 6</button>
        <button type="button" class="bed-btn" onclick="onBedClick('Side Room 7')">Side Room 7</button>
      </div>
    </div>

    <div id="dynamic-bed-containers"></div>

    <div id="tab-summary" class="tab-content">
      <div class="card">
        <h2>SystmOne Handover Summary</h2>
        <p style="font-size: 0.82rem; color: var(--nhs-grey); margin-bottom: 14px;">
          Review and copy figures straight into SystmOne when you log onto the laptop.
        </p>
        <div id="summary-cards"></div>
      </div>
    </div>

  </div>

  <div class="bottom-bar">
    <button type="button" class="btn-clear" onclick="clearShift()">Clear Shift</button>
    <button type="button" class="btn-handover" onclick="showTab('summary')">Copy Handover</button>
  </div>

  <script>
    window.onerror = function(msg, url, line) {
      alert("Script Notice: " + msg + " (Line " + line + ")");
      return false;
    };

    var state = {
      allocated: [],
      configs: {},
      data: {}
    };

    var BASE_CONFIG = {
      news: true,
      bowels: true,
      amys: false,
      turning: false,
      lsbp: false,
      weight: false,
      fluids: false,
      diet: false,
      bm: false,
      events: true
    };

    function safeId(str) {
      return str.replace(/[^a-zA-Z0-9]/g, '');
    }

    function onBedClick(bed) {
      var idx = state.allocated.indexOf(bed);
      if (idx > -1) {
        showTab(safeId(bed));
      } else {
        state.allocated.push(bed);
        saveState();
        refreshUI();
      }
    }

    function removeBed(bed) {
      state.allocated = state.allocated.filter(function(b) { return b !== bed; });
      saveState();
      refreshUI();
      showTab('allocation');
    }

    function saveState() {
      try {
        localStorage.setItem("thorndon_v22_data", JSON.stringify(state));
        var el = document.getElementById("save-status");
        if (el) {
          el.textContent = "Saved";
          setTimeout(function() { el.textContent = "Auto-Saved"; }, 1000);
        }
      } catch (e) {}
    }

    function loadState() {
      try {
        var raw = localStorage.getItem("thorndon_v22_data");
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && typeof parsed === "object") {
            state.allocated = Array.isArray(parsed.allocated) ? parsed.allocated : [];
            state.configs = parsed.configs || {};
            state.data = parsed.data || {};
          }
        }
      } catch (e) {}
    }

    function getCfg(bed) {
      if (!state.configs[bed]) {
        state.configs[bed] = Object.assign({}, BASE_CONFIG);
      }
      return state.configs[bed];
    }

    function toggleChart(bed, chartName) {
      var cfg = getCfg(bed);
      cfg[chartName] = !cfg[chartName];
      saveState();
      buildBedTabs();
    }

    function getBedRecord(bed) {
      if (!state.data[bed]) {
        state.data[bed] = {
          news: "", bowels: "",
          amysSacrumStatus: "Skin intact", amysSacrumNotes: "",
          amysLeftHeelStatus: "Skin intact", amysLeftHeelNotes: "",
          amysRightHeelStatus: "Skin intact", amysRightHeelNotes: "",
          amysOtherStatus: "Skin intact", amysOtherNotes: "",
          turning: "", lyingBP: "", standingBP: "", weight: "",
          fluidIn: "", fluidOut: "", bm: "", diet: "", events: ""
        };
      }
      return state.data[bed];
    }

    function setField(bed, field, val) {
      var d = getBedRecord(bed);
      d[field] = val;
      saveState();
    }

    function nowStamp() {
      var n = new Date();
      return "[" + String(n.getHours()).padStart(2, '0') + ":" + String(n.getMinutes()).padStart(2, '0') + "]";
    }

    function addTurn(bed, pos) {
      var d = getBedRecord(bed);
      var line = nowStamp() + " " + pos;
      d.turning = d.turning ? d.turning + "\n" + line : line;
      saveState();
      var el = document.getElementById("turn-area-" + safeId(bed));
      if (el) el.value = d.turning;
    }

    function addFluidIn(bed, amt) {
      var d = getBedRecord(bed);
      var cur = d.fluidIn || "";
      var match = cur.match(/(\d+)\s*ml/);
      if (match) {
        var total = parseInt(match[1], 10) + amt;
        d.fluidIn = cur.replace(match[1] + "ml", total + "ml");
      } else if (cur.trim() === "") {
        d.fluidIn = amt + "ml";
      } else {
        d.fluidIn = cur + " + " + amt + "ml";
      }
      saveState();
      var el = document.getElementById("fluid-in-" + safeId(bed));
      if (el) el.value = d.fluidIn;
    }

    function addFluidOut(bed, text) {
      var d = getBedRecord(bed);
      d.fluidOut = d.fluidOut ? d.fluidOut + "; " + text : text;
      saveState();
      var el = document.getElementById("fluid-out-" + safeId(bed));
      if (el) el.value = d.fluidOut;
    }

    function addBristolStool(bed, val) {
      if (!val) return;
      var d = getBedRecord(bed);
      d.bowels = d.bowels ? d.bowels + "; BO " + val : "BO " + val;
      saveState();
      var el = document.getElementById("bowel-input-" + safeId(bed));
      if (el) el.value = d.bowels;
    }

    function addDiet(bed, text) {
      var d = getBedRecord(bed);
      d.diet = d.diet ? d.diet + "; " + text : text;
      saveState();
      var el = document.getElementById("diet-in-" + safeId(bed));
      if (el) el.value = d.diet;
    }

    function insertNoteTime(bed) {
      var d = getBedRecord(bed);
      var tag = nowStamp() + " ";
      d.events = d.events ? d.events + "\n" + tag : tag;
      saveState();
      var el = document.getElementById("events-area-" + safeId(bed));
      if (el) {
        el.value = d.events;
        el.focus();
      }
    }

    function refreshUI() {
      var btns = document.querySelectorAll("#bed-grid-buttons .bed-btn");
      for (var i = 0; i < btns.length; i++) {
        var b = btns[i];
        var name = b.textContent.replace('✓ ', '').trim();
        if (state.allocated.indexOf(name) > -1) {
          b.className = "bed-btn selected";
          b.textContent = "✓ " + name;
        } else {
          b.className = "bed-btn";
          b.textContent = name;
        }
      }

      var summaryEl = document.getElementById("allocated-summary-text");
      if (summaryEl) {
        if (state.allocated.length === 0) {
          summaryEl.textContent = "Allocated (0): None selected";
        } else {
          summaryEl.textContent = "Allocated (" + state.allocated.length + "): " + state.allocated.join(", ");
        }
      }

      buildNavbar();
      buildBedTabs();
    }

    function buildNavbar() {
      var nav = document.getElementById("navbar");
      var html = '<button id="nav-btn-allocation" class="active" onclick="showTab(\'allocation\')">Beds</button>';

      for (var i = 0; i < state.allocated.length; i++) {
        var bed = state.allocated[i];
        var sId = safeId(bed);
        html += '<button id="nav-btn-' + sId + '" onclick="showTab(\'' + sId + '\')">' + bed + '</button>';
      }

      html += '<button id="nav-btn-summary" onclick="showTab(\'summary\')">Summary</button>';
      nav.innerHTML = html;
    }

    function buildBedTabs() {
      var container = document.getElementById("dynamic-bed-containers");
      var curActive = document.querySelector('.tab-content.active');
      var activeTabId = curActive ? curActive.id : 'tab-allocation';
      container.innerHTML = "";

      for (var i = 0; i < state.allocated.length; i++) {
        var bed = state.allocated[i];
        var sId = safeId(bed);
        var d = getBedRecord(bed);
        var cfg = getCfg(bed);

        var tab = document.createElement("div");
        tab.id = "tab-" + sId;
        tab.className = "tab-content " + (activeTabId === ("tab-" + sId) ? "active" : "");

        var out = [];
        out.push('<div class="card">');
        out.push('<h2><span>' + bed + ' Entry Log</span><button type="button" class="secondary-btn" style="color:var(--nhs-red-text);border-color:var(--nhs-red-border);" onclick="removeBed(\'' + bed + '\')">Remove Bed</button></h2>');

        out.push('<div class="tracking-toggles"><small>Toggle Active Charts for ' + bed + '</small><div class="toggle-chips">');
        out.push('<button type="button" class="toggle-chip ' + (cfg.news ? 'active' : '') + '" onclick="toggleChart(\'' + bed + '\', \'news\')">' + (cfg.news ? '✓' : '+') + ' NEWS2</button>');
        out.push('<button type="button" class="toggle-chip ' + (cfg.bowels ? 'active' : '') + '" onclick="toggleChart(\'' + bed + '\', \'bowels\')">' + (cfg.bowels ? '✓' : '+') + ' Bowels</button>');
        out.push('<button type="button" class="toggle-chip ' + (cfg.amys ? 'active' : '') + '" onclick="toggleChart(\'' + bed + '\', \'amys\')">' + (cfg.amys ? '✓' : '+') + ' Amy\'s Round</button>');
        out.push('<button type="button" class="toggle-chip ' + (cfg.turning ? 'active' : '') + '" onclick="toggleChart(\'' + bed + '\', \'turning\')">' + (cfg.turning ? '✓' : '+') + ' Turning</button>');
        out.push('<button type="button" class="toggle-chip ' + (cfg.lsbp ? 'active' : '') + '" onclick="toggleChart(\'' + bed + '\', \'lsbp\')">' + (cfg.lsbp ? '✓' : '+') + ' Lying/Standing BP</button>');
        out.push('<button type="button" class="toggle-chip ' + (cfg.weight ? 'active' : '') + '" onclick="toggleChart(\'' + bed + '\', \'weight\')">' + (cfg.weight ? '✓' : '+') + ' Weight</button>');
        out.push('<button type="button" class="toggle-chip ' + (cfg.fluids ? 'active' : '') + '" onclick="toggleChart(\'' + bed + '\', \'fluids\')">' + (cfg.fluids ? '✓' : '+') + ' Fluid Balance</button>');
        out.push('<bu
